# XcodeGen project for Meshron on iPhone. Generated in CI (.github/workflows/ios.yml):
#   app.bundle      <- bare-pack --preset ios --linked cross/core/boot-bare.js
#   addons/         <- bare-link --preset ios (one .xcframework per native addon)
#   addons.yml      <- lists those xcframeworks (written by the workflow)
#   App/ui          <- copy of cross/ui
name: Meshron
options:
  bundleIdPrefix: com.xalvxnlab
  deploymentTarget:
    iOS: "16.4"
include:
  - path: addons.yml
    relativePaths: false
packages:
  BareKit:
    url: https://github.com/holepunchto/bare-kit-swift
    exactVersion: 2.2.0
targets:
  Meshron:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xalvxnlab.meshron
        PRODUCT_NAME: Meshron
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Meshron
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Meshron connects directly to your friends' devices on this network.
        NSCameraUsageDescription: Meshron uses the camera for video calls and to take photos you send.
        NSMicrophoneUsageDescription: Meshron uses the microphone for voice and video calls.
        NSPhotoLibraryUsageDescription: Meshron lets you pick photos to send in a chat.
        NSPhotoLibraryAddUsageDescription: Meshron can save photos you received to your library.
        CFBundleURLTypes:
          - CFBundleURLName: com.xalvxnlab.meshron.link
            CFBundleURLSchemes: [meshron]
    sources:
      - path: App
        excludes: [ui, "ui/**"]
      - path: App/ui
        type: folder
        buildPhase: resources
      - path: app.bundle
        buildPhase: resources
    dependencies:
      - package: BareKit
