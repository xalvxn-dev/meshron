<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Meshron companion</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* The head is drawn by the skin renderer into its own small canvas, off to the side. */
    canvas#head { position: absolute; left: -400px; top: 0; width: 120px; height: 120px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="head"></canvas>
  <script src="reactor.js"></script>
  <script src="pal.js"></script>
</body>
</html>
